<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dakbox Driver</title>
<style>
/* Driver app: one job at a time, big buttons, money first. */
:root{--bg:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--go:#22C55E;--gold:#FBBF24;--stop:#F87171;--blue:#60A5FA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0} h2{font-size:15px;margin:0;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
p{margin:0} .muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input,select{font:17px -apple-system,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.btn{font:700 18px -apple-system,system-ui,sans-serif;border:0;border-radius:12px;padding:16px;width:100%;cursor:pointer;color:#06210F;background:var(--go);text-align:center;text-decoration:none;display:block}
.btn.blue{background:var(--blue);color:#0B1A33} .btn.light{background:#334155;color:var(--ink)}
.btn.text{background:none;color:var(--muted);font-weight:500;font-size:15px;padding:8px}
.btn[disabled]{opacity:.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.truck{font-weight:800;font-size:20px;letter-spacing:.02em}
.sw{display:flex;align-items:center;gap:10px;background:#334155;border:0;border-radius:999px;padding:6px 14px 6px 6px;color:var(--ink);font:700 15px -apple-system,system-ui,sans-serif;cursor:pointer}
.sw i{width:26px;height:26px;border-radius:50%;background:var(--muted)}
.sw.on{background:#14532D} .sw.on i{background:var(--go)}
.card.earn{flex-direction:row;justify-content:space-between;align-items:center;padding:12px 18px}
.earn b{font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums}
.job.offer{border-color:var(--gold);box-shadow:0 0 0 2px rgba(251,191,36,.25)}
.job.back{border-color:#16A34A;box-shadow:0 0 0 3px rgba(22,163,74,.3)}
.timer{margin:0 0 6px;color:#B45309;font-weight:600}
.plan{margin:8px 0;padding:8px 10px;border-radius:8px;background:rgba(22,163,74,.08);line-height:1.6}
.backnote{margin:0 0 8px;padding:8px 10px;border-radius:8px;background:#DCFCE7;color:#14532D;font-weight:600}
.area{font-size:26px;font-weight:800;line-height:1.15}
.pay{font-size:40px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.facts{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;color:var(--muted)} .facts b{color:var(--ink)}
.addr{font-size:16px}
.note{border-radius:10px;padding:10px 12px;font-size:14px;background:rgba(248,113,113,.12);color:#FECACA}
.empty{text-align:center;padding:28px 18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div id="setup" class="card" hidden><p>Not connected. Fill in config.js.</p></div>

  <!-- Sign in -->
  <form id="login" class="card" hidden>
    <h1>Dakbox Driver</h1>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="note" id="loginErr" hidden></p>
  </form>

  <!-- Pick truck (first time) -->
  <div id="pick" class="card" hidden>
    <h1>Which truck are you driving?</h1>
    <select id="truck" aria-label="Truck"></select>
    <button class="btn" id="pickGo" type="button">Continue</button>
  </div>

  <!-- Main -->
  <section id="app" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="top">
      <span class="truck" id="truckNo"></span>
      <button class="sw" id="online" type="button" aria-pressed="false"><i></i><span>Offline</span></button>
    </div>
    <p class="note" id="net" hidden></p>

    <div class="card earn"><span class="muted">Today's earnings<br><span id="doneCount">0 pickups</span></span><b id="earned">₹0</b></div>

    <div id="jobs"></div>

    <button class="btn text" id="change" type="button">Change truck</button>
    <button class="btn text" id="logout" type="button">Sign out</button>
  </section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=n=>"₹"+Math.round(+n||0).toLocaleString("en-IN");
const cfg=window.DAKBOX||{};
const sb=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
const SEND_EVERY_MS=30000, REFRESH_MS=15000;
const S={truck:null,online:false,pos:null,watch:null,lastSent:0,pins:[],jobs:[],busy:false};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function netErr(msg){$("net").hidden=!msg;$("net").textContent=msg||""}
// Every database call goes through here: shows a plain message instead of "Failed to fetch".
// optional extras (return loads, plans): never show an error or stop the page if they are not set up yet
async function opt(promise){try{const r=await promise;return r.error?null:r.data}catch(e){return null}}
async function q(promise){
  try{const r=await promise; if(r.error)throw r.error; netErr(""); return r.data}
  catch(e){netErr(/fetch|network/i.test(e.message||"")?"No internet connection. Retrying…":(e.message||"Something went wrong"));throw e}
}

// ---------- sign in and truck
async function boot(){
  if(!sb){$("setup").hidden=false;return}
  const {data:{session}}=await sb.auth.getSession();
  session?afterLogin():$("login").hidden=false;
}
$("login").addEventListener("submit",async e=>{
  e.preventDefault();$("loginErr").hidden=true;
  const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pw").value});
  if(error){$("loginErr").hidden=false;$("loginErr").textContent=/fetch/i.test(error.message)?"No internet connection.":"Wrong email or password.";return}
  $("login").hidden=true;afterLogin();
});
async function afterLogin(){
  try{S.pins=await q(sb.from("pincodes").select("pincode,area,city,lat,lon"))}catch(e){S.pins=[]}
  try{S.wh=await q(sb.from("warehouses").select("code,name,city,address,lat,lon"))}catch(e){S.wh=[]}
  const saved=store.get("dakbox_truck");
  if(saved){S.truck=saved;showApp()}else showPick();
}
async function showPick(){
  $("app").hidden=true;$("pick").hidden=false;
  let trucks=[];
  try{trucks=await q(sb.from("trucks").select("truck_no,driver_name").order("truck_no"))}catch(e){setTimeout(showPick,5000);return}
  if(!trucks.length){$("truck").innerHTML='<option value="">No trucks yet. Ask the office to add yours.</option>';$("pickGo").disabled=true;return}
  $("truck").innerHTML=trucks.map(t=>`<option value="${esc(t.truck_no)}">${esc(t.truck_no)} · ${esc(t.driver_name)}</option>`).join("");
  $("pickGo").disabled=false;
}
$("pickGo").addEventListener("click",()=>{S.truck=$("truck").value;if(!S.truck)return;store.set("dakbox_truck",S.truck);showApp()});
$("change").addEventListener("click",()=>{goOffline();store.del("dakbox_truck");S.truck=null;showPick()});
$("logout").addEventListener("click",async()=>{await goOffline();store.del("dakbox_truck");await sb.auth.signOut();location.reload()});

function showApp(){
  $("pick").hidden=true;$("app").hidden=false;$("truckNo").textContent=S.truck;
  loadJobs();setInterval(loadJobs,REFRESH_MS);
  if(store.get("dakbox_online")==="1")goOnline();
}

// ---------- online / offline (location runs in the background while online)
$("online").addEventListener("click",()=>S.online?goOffline():goOnline());
async function goOnline(){
  if(!("geolocation" in navigator)){netErr("This phone can't share location.");return}
  S.online=true;store.set("dakbox_online","1");paintSwitch();
  S.watch=navigator.geolocation.watchPosition(p=>{S.pos=p;netErr("");if(Date.now()-S.lastSent>=SEND_EVERY_MS)sendPos();renderJobs()},
    e=>{netErr(e.code===1?"Location is off. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using. Then reload.":"Looking for GPS signal…")},
    {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  S.tick=setInterval(()=>{if(S.pos&&Date.now()-S.lastSent>=SEND_EVERY_MS)sendPos()},5000);
  keepAwake();
  try{await q(sb.from("trucks").update({status:"available"}).eq("truck_no",S.truck))}catch(e){}
}
async function goOffline(){
  if(S.watch!==null&&S.watch!==undefined)navigator.geolocation.clearWatch(S.watch);
  clearInterval(S.tick);S.watch=null;S.online=false;store.set("dakbox_online","0");paintSwitch();
  if(S.wake){S.wake.release().catch(()=>{});S.wake=null}
  if(S.truck)try{await q(sb.from("trucks").update({status:"off_duty"}).eq("truck_no",S.truck))}catch(e){}
}
function paintSwitch(){const b=$("online");b.classList.toggle("on",S.online);b.setAttribute("aria-pressed",S.online);b.querySelector("span").textContent=S.online?"Online":"Offline";renderJobs()}
async function sendPos(){
  if(S.sending||!S.pos)return;S.sending=true;const c=S.pos.coords;
  try{await q(sb.from("gps_pings").insert({truck_no:S.truck,lat:+c.latitude.toFixed(6),lon:+c.longitude.toFixed(6),
      speed_kmph:c.speed!=null&&c.speed>=0?Math.round(c.speed*3.6):null,recorded_at:new Date(S.pos.timestamp).toISOString(),source:"phone"}));S.lastSent=Date.now()}catch(e){}
  S.sending=false;
}
async function keepAwake(){try{if("wakeLock" in navigator)S.wake=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(S.online)keepAwake();loadJobs()}});

// ---------- jobs
async function loadJobs(){
  if(!S.truck)return;
  const today=new Date();today.setHours(0,0,0,0);
  try{[S.jobs,S.legsDone,S.backLegs]=await Promise.all([q(sb.from("orders").select("*").eq("truck_no",S.truck)),
    opt(sb.from("parcel_legs").select("awb,from_wh,to_wh,driver_pay,unloaded_at").eq("truck_no",S.truck).gte("unloaded_at",today.toISOString())),
    opt(sb.from("parcel_legs").select("awb").eq("truck_no",S.truck).eq("backhaul",true).is("unloaded_at",null))])}catch(e){return}
  S.legsDone=S.legsDone||[];S.backLegs=S.backLegs||[];
  // the return plan: the one offered (with its stops), or a preview of the way home while driving out
  const pl=await opt(sb.from("return_plans").select("plan,created_at").eq("truck_no",S.truck).order("created_at",{ascending:false}).limit(1));S.plan=pl&&pl[0]?pl[0].plan:null;
  S.preview=null;if((S.jobs||[]).some(o=>["driver_accepted","picked_up"].includes(o.status)&&!(S.backLegs||[]).some(l=>l.awb===o.awb)))S.preview=await opt(sb.rpc("plan_return",{p_truck:S.truck}));
  if(!S.settings){const st=await opt(sb.from("settings").select("offer_timeout_min").eq("id",1));S.settings=(st&&st[0])||{}}
  // a new return load: buzz and show the alert once
  S.backhaul=new Set((S.backLegs||[]).map(l=>l.awb));
  const newOffers=(S.jobs||[]).filter(o=>o.status==="pickup_assigned"&&S.backhaul.has(o.awb)&&!(S.alerted||new Set()).has(o.awb));
  if(newOffers.length){S.alerted=new Set([...(S.alerted||[]),...newOffers.map(o=>o.awb)]);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
  renderJobs();
}
function km(a,b,c,d){const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function isToday(t){if(!t)return false;const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()}

function renderJobs(){
  const jobs=S.jobs||[], wh=new Map((S.wh||[]).map(w=>[w.code,w]));
  // Group parcels into trips: the same leg (hub to hub), from where the parcel is now to its next warehouse
  const group=list=>{const m=new Map();list.forEach(o=>{const f=o.cur_wh??o.from_wh,d=o.next_wh??o.to_wh,k=f+"|"+(d||"");if(!m.has(k))m.set(k,{from:wh.get(f),to:wh.get(d),o:f,d,rows:[]});m.get(k).rows.push(o)});return[...m.values()]};
  // Earned today: legs unloaded today (a parcel moves on to the next truck at a hub, so legs are the record)
  const doneToday=S.legsDone||[];
  $("earned").textContent=inr(doneToday.reduce((s,o)=>s+(+o.driver_pay||0),0));
  const tripsDone=group(doneToday).length;
  $("doneCount").textContent=tripsDone+(tripsDone===1?" trip":" trips");
  const sum=(rows,f)=>Math.round(rows.reduce((a,o)=>a+(+o[f]||0),0)*10)/10;
  const name=w=>w?w.name:"Warehouse";
  const tripKm=t=>t.from&&t.to?km(t.from.lat,t.from.lon,t.to.lat,t.to.lon):null;
  const away=w=>S.pos&&w?km(S.pos.coords.latitude,S.pos.coords.longitude,w.lat,w.lon):null;
  const fmtKm=d=>d==null?"":d<1?Math.round(d*1000)+" m":Math.round(d)+" km";
  const nav=w=>w?`https://www.google.com/maps/dir/?api=1&destination=${w.lat},${w.lon}`:"#";
  const btn=(a,t,label,cls="btn")=>`<button class="${cls}" data-a="${a}" data-o="${t.o}" data-d="${t.d||""}">${label}</button>`;
  let h="";
  const active=group(jobs.filter(o=>["driver_accepted","picked_up"].includes(o.status)));
  active.forEach(t=>{
    const loaded=t.rows.every(o=>o.status==="picked_up"), goTo=loaded?t.to:t.from, scanned=t.rows.filter(o=>o.status==="picked_up").length;
    h+=`<div class="card job"><h2>${loaded?"Drive to":"Go to"}</h2>
      <div class="area">${esc(name(goTo))}</div>
      <p class="addr">${esc(goTo?.address||"")}${goTo?.city?", "+esc(goTo.city):""}</p>
      <div class="facts"><span><b>${t.rows.length} parcel${t.rows.length>1?"s":""}</b></span><span>${sum(t.rows,"charged_kg")} kg</span>${away(goTo)!=null?`<span>${fmtKm(away(goTo))} away</span>`:""}<span>Trip pay <b>${inr(sum(t.rows,"driver_pay"))}</b></span></div>
      <a class="btn blue" href="${nav(goTo)}" target="_blank" rel="noopener">Navigate</a>
      ${loaded?`<p class="muted">At ${esc(name(t.to))}, staff scan your parcels off the truck.</p>`
        :scanned?`<p class="addr"><b>Loading: ${scanned} of ${t.rows.length} parcels scanned</b></p>`
        :`<p class="muted">At the warehouse, staff scan each parcel onto your truck.</p>`+btn("decline",t,"Can't do this trip","btn text")}
    </div>`});
  group(jobs.filter(o=>o.status==="pickup_assigned")).forEach(t=>{
    const tk=tripKm(t),back=t.rows.some(o=>(S.backhaul||new Set()).has(o.awb));
    const left=S.settings&&S.settings.offer_timeout_min?Math.max(0,Math.ceil((Date.parse(t.rows[0].assigned_at)+S.settings.offer_timeout_min*60000-Date.now())/60000)):null;
    const pb=back&&S.plan&&S.plan.best;
    h+=`<div class="card job offer${back?" back":""}">${back?`<p class="backnote">Return load: parcels going your way home. Your truck drives back anyway, so this is extra pay.</p>`:""}<h2>${back?"Return load":"New trip"}</h2>${left!=null?`<p class="timer">Answer within ${left} min, or it goes to another truck</p>`:""}
      <div class="pay">${inr(sum(t.rows,"driver_pay"))}</div>
      <div class="area">${esc(name(t.from))} → ${esc(name(t.to))}</div>
      <div class="facts">${away(t.from)!=null?`<span><b>${fmtKm(away(t.from))}</b> to pickup</span>`:""}${tk!=null?`<span><b>${fmtKm(tk)}</b> trip</span>`:""}<span>${t.rows.length} parcel${t.rows.length>1?"s":""}, ${sum(t.rows,"charged_kg")} kg</span></div>
      ${pb?`<div class="plan"><b>Your way home</b>${pb.stops.map((s,i)=>`<div>${i+1}. ${esc(s.from_name)} → ${esc(s.to_name)}: ${s.parcels?`${s.parcels} parcel${s.parcels>1?"s":""}, ${s.km} km, pay ${inr(s.driver)}`:`empty, ${s.km} km`}${i?" <span class=\"muted\">(offered when you unload at stop "+i+")</span>":""}</div>`).join("")}<div class="muted">Whole way home: ${pb.km} km${pb.extra_km>0?` (+${pb.extra_km} km detour)`:""}, your pay ${inr(pb.driver)}</div></div>`:""}
      ${btn("accept",t,back?"Accept return load":"Accept trip")}${btn("decline",t,"Decline","btn text")}</div>`});
  const pv=S.preview&&S.preview.best;
  if(pv)h+=`<div class="card job"><h2>On your way back (forecast)</h2><div class="area">${esc(S.preview.at_name)} → ${esc(S.preview.home_name)}</div>
    ${pv.stops.map((s,i)=>`<p class="addr">${i+1}. ${esc(s.from_name)} → ${esc(s.to_name)}: ${s.parcels?`${s.parcels} parcel${s.parcels>1?"s":""} waiting, pay about ${inr(s.driver)}`:`empty, ${s.km} km`}</p>`).join("")}
    <p class="muted">Offered automatically when you unload. Parcels may be taken by another truck before then.</p></div>`;
  if(!h)h=S.online
    ?`<div class="card empty"><p><b>No trips right now</b></p><p class="muted">Stay online. New trips from warehouses near you appear here.</p></div>`
    :`<div class="card empty"><p><b>You're offline</b></p><p class="muted">Go online to start getting trips.</p><button class="btn" type="button" onclick="goOnline()">Go online</button></div>`;
  $("jobs").innerHTML=h;
}
$("jobs").addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b||S.busy)return;
  S.busy=true;b.disabled=true;
  try{await q(sb.rpc("driver_trip_action",{p_truck:S.truck,p_origin:b.dataset.o,p_dest:b.dataset.d||null,p_action:b.dataset.a}))}catch(err){}
  S.busy=false;loadJobs();
});
boot();
</script>
</body>
</html>
